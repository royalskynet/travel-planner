[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-assistant"
version = "2.0.0"
description = "Offline-first, source-aware travel planning assistant"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "icalendar>=6,<7",
    "pydantic>=2.10,<3",
]

[project.scripts]
travel-assistant = "travel_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
